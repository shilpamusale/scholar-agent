# .github/workflows/ci.yml
# This workflow defines our Continuous Integration (CI) pipeline.
# It will run automatically on every push and pull request to the main branch.

name: ScholarAgent CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # --- Step 1: Check out the repository code ---
      - name: Check out repository
        uses: actions/checkout@v4

      # --- Step 2: Set up the specified Python version ---
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3: Install system dependencies ---
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev

      # --- Step 4: Install Python dependencies ---
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- Step 5: Run linter with ruff ---
      - name: Lint with ruff
        run: |
          ruff check .
          ruff format . --check

      # --- Step 6: Run tests with pytest ---
      - name: Run tests
        run: |
          python -m pytest
