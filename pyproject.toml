# pyproject.toml

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

[tool.nbqa.config]
# Ignore "imports not at top of file" only for notebooks
ruff = ["--extend-ignore=E402"]

[tool.nbqa.addopts]
# Auto-fix issues in notebooks where possible
ruff = ["--fix"]
isort = []
