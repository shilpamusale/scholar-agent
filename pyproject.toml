# pyproject.toml

[project]
name = "scholar-agent"
version = "0.1.0"
description = "A multi-agent AI system for building and querying a knowledge graph from research papers."
authors = [
    { name = "Ishi", email = "your-email@example.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # --- LLM & Agent Frameworks ---
    "langchain",
    "langchain-google-genai",
    "langgraph",
    "sentence-transformers",
    "ragas==0.1.7",
    "flashrank",

    # --- Vector Store ---
    "chromadb",

    # --- API Framework ---
    "fastapi",
    "uvicorn",

    # --- Data Handling & Notebooks ---
    "pandas",
    "numpy",
    "jupyterlab",
    "pypdf",
    "datasets",

    # --- Graph Database ---
    "neo4j",

    # --- Utilities & Dev Tools ---
    "python-dotenv",
    "tqdm",
    "ruff",
    "nbqa",
    "isort",

    # --- Testing & Code Quality ---
    "pytest",
    "pre-commit",

    # --- Visualization ---
    "pygraphviz",
]

# --- Tooling Configuration (Your existing code) ---

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]

[tool.nbqa.config]
# Ignore "imports not at top of file" only for notebooks
ruff = ["--extend-ignore=E402"]

[tool.nbqa.addopts]
# Auto-fix issues in notebooks where possible
ruff = ["--fix"]
isort = []
