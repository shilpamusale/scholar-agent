[project]
name = "scholar-agent"
version = "0.1.0"
description = "A multi-agent AI system for research."
authors = [{ name = "Ishi", email = "your@email.com" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain",
    "langchain-google-genai",
    "langgraph",
    "sentence-transformers",
    "ragas==0.1.7",
    "flashrank",
    "chromadb",
    "fastapi",
    "uvicorn",
    "pandas",
    "numpy",
    "jupyterlab",
    "pypdf",
    "datasets",
    "python-dotenv",
    "tqdm",
    "ruff",
    "nbqa",
    "isort",
    "pytest",
    "pre-commit",
    "pygraphviz",
    "neo4j",
]

[project.urls]
"Homepage" = "https://github.com/shilpamusale/scholar-agent"

# --- FIX: Tell the build system where to find the package ---
[tool.setuptools.packages.find]
where = ["src"]  # Look for packages inside the 'src' directory

# --- Tool Configurations ---
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

[tool.nbqa.config]
# Ignore "imports not at top of file" only for notebooks
ruff = ["--extend-ignore=E402"]

[tool.nbqa.addopts]
# Auto-fix issues in notebooks where possible
ruff = ["--fix"]
isort = []
